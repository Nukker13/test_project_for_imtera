services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-imtera}
      POSTGRES_USER: ${DB_USERNAME:-imtera}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-imtera} -d ${DB_DATABASE:-imtera}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Python-сервис с парсером. Отдельный контейнер, потому что тянет за собой
  # браузер и его системные зависимости — держать это в php-образе незачем.
  python-service:
    build: ./parser
    environment:
      YANDEX_MAX_PAGES: ${YANDEX_MAX_PAGES:-12}
      YANDEX_PAGE_SIZE: ${YANDEX_PAGE_SIZE:-50}
      PARSER_DELAY_MIN_MS: ${PARSER_DELAY_MIN_MS:-400}
      PARSER_DELAY_MAX_MS: ${PARSER_DELAY_MAX_MS:-1200}
      LOG_LEVEL: ${PARSER_LOG_LEVEL:-INFO}
    ports:
      - "${PARSER_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-imtera}
      DB_USERNAME: ${DB_USERNAME:-imtera}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      SESSION_DRIVER: database
      PARSER_URL: http://python-service:8001
      PARSER_TIMEOUT: ${PARSER_TIMEOUT:-600}
      APP_URL: http://localhost:${APP_PORT:-8000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
    volumes:
      - ./backend:/var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Готовность считается по /up, то есть уже после миграций и сида —
      # воркер очереди ждёт именно этого, иначе стартует на пустой схеме.
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Воркер очереди отдельным контейнером, а не рядом с веб-процессом: парсинг
  # идёт минутами, и его нагрузка не должна конкурировать с обработкой запросов.
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan queue:work --tries=1 --timeout=900 --verbose
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-imtera}
      DB_USERNAME: ${DB_USERNAME:-imtera}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      SESSION_DRIVER: database
      PARSER_URL: http://python-service:8001
      PARSER_TIMEOUT: ${PARSER_TIMEOUT:-600}
      # Схему создаёт и сидит только веб-контейнер, иначе два процесса полезут
      # мигрировать одновременно.
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      app:
        condition: service_healthy
      python-service:
        condition: service_started

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Vite проксирует /api и /sanctum на backend, поэтому для браузера фронт и
      # бэк живут на одном origin и Sanctum-куки работают без возни с CORS.
      VITE_BACKEND_ORIGIN: http://app:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - app

volumes:
  db-data:
  frontend-node-modules:
